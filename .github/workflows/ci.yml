name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q heart_score.py cli.py simulator.py agents tests
      - name: Run tests
        run: python -m pytest -q
      - name: Check dependency consistency
        run: python -m pip check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/score.mjs
          node --check web/app.mjs
          node --check web/score.test.mjs
      - name: Test browser scoring logic
        run: node --test web/score.test.mjs
      - name: Smoke-test static site and module responses
        run: |
          python3 -m http.server 8765 --directory web &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/app.mjs > /dev/null
          curl -fsS http://127.0.0.1:8765/score.mjs > /dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t heart-pathway-score:ci .
      - name: Smoke-test API
        run: |
          docker run -d --name heart-score-ci -p 127.0.0.1:18000:8000 heart-pathway-score:ci
          trap "docker rm -f heart-score-ci" EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 1
          done
          docker logs heart-score-ci
          exit 1
